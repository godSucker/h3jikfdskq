name: Parser - Rebalance Mode

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Общая группа с sync-cron.yml/parser-textures-only.yml: все три читают-меняют-
# перезаписывают ВЕСЬ mutants.json целиком. Без общей группы ручной запуск,
# совпавший с дневным cron, - гонка чтения-изменения-записи на весь файл,
# а не просто конфликт при пуше.
concurrency:
  group: sync-cron
  cancel-in-progress: false

jobs:
  rebalance-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Установка зависимостей
        run: npm ci

      - name: 4. Запуск Парсера (Режим REBALANCE)
        run: npx tsx scripts/sync-mutants.ts rebalance

      - name: 4.1 Пересборка топ-листов (toplists.json)
        # Именно этот режим дописывает rebalance-history.json - новую "точку
        # времени" для /top-mutants нужно пересчитать здесь же, а не ждать
        # следующего дневного sync-cron.
        run: npx tsx scripts/build-toplists.ts

      - name: 5. Проверка изменений
        id: check-changes
        run: |
          if git diff --quiet src/data/mutants/*.json 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Изменений не обнаружено"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Обнаружены изменения в данных"
          fi

      - name: 6. Сохранение изменений (Commit & Push)
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Parser Rebalance: Умное обновление данных"
          commit_user_name: "MGG Parser Bot"
          commit_user_email: "bot@archivist-library.com"
          commit_author: "MGG Parser Bot <bot@archivist-library.com>"
          branch: main
          file_pattern: 'src/data/mutants/*.json'

      - name: 6.1 Авто-публикация анонса (ребаланс)
        # Публикуем сразу, не дожидаясь завтрашнего дневного sync-cron -
        # ребаланс запускается вручную/по вебхуку, задержка в анонсе не нужна.
        # Тот же ledger (scripts/announced-ids-cache.json), что у sync-cron.yml -
        # общая concurrency-группа "sync-cron" (см. комментарий вверху файла)
        # не даёт этому и дневному прогону писать в него одновременно.
        if: steps.check-changes.outputs.has_changes == 'true'
        run: npx tsx scripts/build-announcements.ts

      - name: 6.2 Сохранение анонса
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Parser Rebalance: анонс'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          file_pattern: 'src/data/announcements.json scripts/announced-ids-cache.json'

      - name: 7. Итоги работы
        if: always()
        run: |
          echo "## 📊 Итоги парсера (REBALANCE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **Статус:** Обнаружены изменения, данные обновлены" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Статус:** Изменений не обнаружено" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕐 **Время запуска:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ **Режим парсера:** REBALANCE (умное обновление только изменённых данных)" >> $GITHUB_STEP_SUMMARY

      - name: 8. Триггер синхронизации preview
        # git-auto-commit-action пушит через дефолтный GITHUB_TOKEN, а такие пуши
        # не каскадируют в другие push-триггеры (анти-рекурсивная защита GitHub) -
        # sync-preview-branch.yml сам не запускался. workflow_dispatch - исключение
        # из этого правила, дёргаем явно. Идемпотентно, лишний вызов не страшен.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-preview-branch.yml --ref main
