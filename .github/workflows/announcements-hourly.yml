name: Announcements Hourly

# Лёгкие детекторы (без рендера текстур мутантов/скинов - та тяжёлая часть
# остаётся на sync-cron.yml раз в сутки) - гоняются каждый час в окне 10-19
# МСК (07-16 UTC), чтобы анонсы появлялись быстро, а не раз в сутки. Каждый
# скрипт быстрый (один-два сетевых фетча XML/CSV + чтение JSON), суммарно
# прогон занимает секунды-полторы минуты. См. память auto-announcements-
# architecture.
on:
  schedule:
    - cron: '0 7-16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Общая группа с finish-pending.yml - оба финально запускают
# build-announcements.ts и коммитят src/data/announcements.json +
# scripts/announced-ids-cache.json через git-auto-commit-action. Раньше у
# каждого была своя группа, они не блокировали друг друга - если .локал
# пришёл во время часового прогона, второй workflow мог упереться в
# non-fast-forward push и потерять коммит. Общая группа = ровно один пишет
# в эти файлы одновременно, второй ждёт в очереди.
concurrency:
  group: announcements-writes
  cancel-in-progress: false

jobs:
  hourly-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Установка зависимостей
        run: npm ci

      # if: always() на шагах 4-9 ОБЯЗАТЕЛЕН: без него сбой любого одного
      # детектора (например, sync-bingo.ts упал на сетевой ошибке) по
      # умолчанию GitHub Actions пропускает ВСЕ следующие шаги джобы разом -
      # боксы/обменники/жетоны/реакторы/данжи молча не проверяются весь час,
      # хотя каждый из них сам по себе устойчив к пропуску прогона (найдено
      # код-ревью 2026-08-08 при аудите анонс-пайплайна).
      - name: 4. Авто-синк бинго-досок (morphology, s-beta)
        if: always()
        run: npx tsx scripts/sync-bingo.ts

      - name: 5. Авто-синк каталога боксов (shopitems.xml, s-beta)
        if: always()
        run: npx tsx scripts/build-boxes.ts

      - name: 6. Сторож ротации обменников (джекпот/ивент) - авто-запись в obtain.json
        if: always()
        run: npx tsx scripts/detect-exchange-rotation.ts

      - name: 6.5 Перевод новых записей obtain.json (obtain-names.{lang}.json)
        # Идёт СРАЗУ после шага 6 - тот пишет в obtain.json RU-only (детект
        # ротации обменников), без этого шага новые записи молча копились бы
        # untranslated до ручного прогона. Полностью регенерирует
        # obtain-names.{lang}.json из текущего obtain.json - идемпотентно,
        # никакой ручной курации внутри этих файлов нет (в отличие от
        # materials-i18n.json).
        if: always()
        run: npx tsx scripts/sync-obtain-names.ts

      - name: 7. Авто-синк жетонов (gamedefinitions.xml, s-beta) -> material.json
        if: always()
        run: npx tsx scripts/detect-tokens.ts

      - name: 8. Сторож новых реакторов (gacha.xml, s-beta)
        if: always()
        run: npx tsx scripts/detect-new-reactors.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 9. Сторож новых рейдов/лесенок/спец-лесенок (dungeons.xml, s-beta)
        if: always()
        run: npx tsx scripts/detect-new-dungeons.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 9.5 Живые точные даты офферов (kartel getuser, acceptFuturFilters)
        # Статичные shopitems.xml/dailypopup.xml несут только номер спринта
        # (2-недельное окно) - точный день конкретного оффера решает сервер
        # в реальном времени и виден только авторизованному игровому клиенту.
        # См. память auto-announcements-architecture.md ("ПРОРЫВ: точные даты
        # РЕШЕНЫ"). continue-on-error - это ОБОГАЩЕНИЕ, не критический путь:
        # detect-shop-forecast.ts/detect-daily-news.ts сами падают обратно на
        # диапазон всего спринта, если scripts/live-filter-dates.json нет.
        id: kartel_fetch
        if: always()
        continue-on-error: true
        run: |
          pip install requests
          python3 scripts/kartel/fetch-filters.py > scripts/live-filter-dates.json
        env:
          KARTEL_AUTH_BLOB_B64: ${{ secrets.KARTEL_AUTH_BLOB_B64 }}

      - name: 9.6 Алерт при сбое живых дат (истёк auth.bin?)
        # auth_request_fresh.bin живёт ~60 дней - это активный алерт "прямо
        # сейчас сломалось", а не только ежемесячное календарное напоминание
        # (kartel-auth-reminder.yml) - токен может истечь раньше/позже 60 дней.
        if: always() && steps.kartel_fetch.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="🔴 *Kartel-фильтры*: не удалось получить живые точные даты офферов. Скорее всего истёк \`auth_request_fresh.bin\` (~60 дней) - нужно обновить и перезалить секрет \`KARTEL_AUTH_BLOB_B64\`. Прогноз магазина продолжит работать на диапазоне всего спринта (без точных дат), ничего не сломано."

      - name: 10. Публикация анонсов (в т.ч. прогноз магазина/daily_news) + кросс-пост в канал
        # Прогноз магазина и daily_news не пишут отдельных файлов - тянут
        # shopitems.xml/dailypopup.xml прямо внутри build-announcements.ts
        # (detectShopForecast/detectDailyNews), публикуют сразу в announcements.json.
        # TELEGRAM_CHANNEL_ID - id ПУБЛИЧНОГО канала (не путать с TELEGRAM_CHAT_ID,
        # личным чатом владельца) - см. scripts/telegram-cross-post.ts.
        if: always()
        run: npx tsx scripts/build-announcements.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # TELEGRAM_CHAT_ID (личный чат, не канал) нужен notifyDetectorFailure()
          # и notifyRunSummary() внутри build-announcements.ts - без него оба
          # молча ничего не отправляют (тихий best-effort гейт на оба секрета).
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 11. Коммит всех изменений
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-Sync (часовой): бинго/боксы/обменники/жетоны/реакторы/данжи/анонсы'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          file_pattern: >-
            src/data/bingos.json
            src/data/boxes.json
            public/boxes/**
            public/materials/**
            src/data/mutants/obtain.json
            src/data/mutants/obtain-names.*.json
            src/data/materials/material.json
            scripts/pending-names-cache.json
            src/data/announcements.json
            scripts/announced-ids-cache.json
            scripts/pending-screenshots.json

      - name: 12. Синхронизация новых иконок боксов/жетонов с Яндекс CDN
        # Тот же инкрементальный приём, что в sync-cron.yml (шаг 7) - только
        # изменённые в этом коммите файлы, не вся папка целиком. Жетоны
        # добавлены 2026-08-08 - detect-tokens.ts теперь качает их в
        # public/materials/, а не подставляет хотлинк на Kobojo (см. память
        # feedback-tokens-download-not-hotlink).
        if: always()
        run: |
          pip install awscli

          BASE=$(git rev-parse --verify HEAD~1 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            echo "⚠️  Нет предыдущего коммита для diff — пропуск CDN sync"
            exit 0
          fi

          git diff --name-only --no-renames --diff-filter=ACM "$BASE" HEAD -- 'public/boxes/' 'public/materials/' | while read -r f; do
            [ -f "$f" ] || continue
            key="${f#public/}"
            echo "↑ $key"
            aws s3 cp "$f" "s3://archivist-cdn/$key" \
              --endpoint-url https://storage.yandexcloud.net \
              --acl public-read
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1

      - name: 13. Триггер синхронизации preview
        # git-auto-commit-action пушит через дефолтный GITHUB_TOKEN, а такие пуши
        # не каскадируют в другие push-триггеры (анти-рекурсивная защита GitHub) -
        # sync-preview-branch.yml сам не запускался. workflow_dispatch - исключение
        # из этого правила, дёргаем явно. Идемпотентно, лишний вызов не страшен.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-preview-branch.yml --ref main
