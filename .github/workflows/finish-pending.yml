name: Finish Pending (.локал доделка)

# Триггерится telegram-webhook.ts после ответа ".локал <key> \"Имя\"" на
# алерт от detect-new-reactors.ts/detect-new-dungeons.ts. Вебхук (serverless,
# без rclone/aws-кредов) уже записал имя в scripts/resolved-names-cache.json
# и только дёрнул этот workflow_dispatch без inputs - finish-pending.ts сам
# разбирает ВСЕ накопленные ключи в этом файле за один прогон (см. комментарий
# в scripts/finish-pending.ts про причину). Держим и schedule как страховку -
# если dispatch по какой-то причине не долетел (сеть/квота GitHub API), файл
# не потеряется навсегда, доделается на следующем плановом прогоне.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

# Общая группа с announcements-hourly.yml - см. комментарий там. Оба пишут
# в announcements.json/announced-ids-cache.json через git-auto-commit-action,
# запускать их одновременно = гонка на push в main.
concurrency:
  group: announcements-writes
  cancel-in-progress: false

jobs:
  finish-job:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Установка зависимостей
        run: npm ci

      - name: 4. Доделка реакторов/данжей (арт + данные)
        id: finish
        run: npx tsx scripts/finish-pending.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 4.5 Живые точные даты офферов (kartel getuser, acceptFuturFilters)
        # НАЙДЕНО 2026-09-09: этого шага тут не было вообще (в отличие от
        # announcements-hourly.yml) - build-announcements.ts на шаге 5 ниже
        # тоже читает scripts/live-filter-dates.json (shopForecast/dailyNews/
        # raid/ladder/box все точные даты оттуда), но без этого шага файла
        # просто нет - loadFilterDates() тихо фоллбэкается на {}. Мердж-логика
        # (после фикса 30ea7f3bf) теперь ПОЛНОСТЬЮ доверяет fresh - без живых
        # данных fresh честно посчитал "дат нет" и стёр ВСЕ уже известные даты
        # спринта 256 одним прогоном (юзер поймал на живом сайте). Тот же
        # continue-on-error - обогащение, не критический путь.
        id: kartel_fetch
        if: always()
        continue-on-error: true
        run: |
          pip install requests
          python3 scripts/kartel/fetch-filters.py > scripts/live-filter-dates.json
        env:
          KARTEL_AUTH_BLOB_B64: ${{ secrets.KARTEL_AUTH_BLOB_B64 }}

      - name: 5. Публикация анонса (сразу, без ожидания sync-cron) + кросс-пост в канал
        # Реактор/данж только что дописан в gacha.json/raids.json/
        # special-ladders.json - build-announcements.ts увидит его как обычный
        # diff, без дублирования логики резолвинга иконок отдельно здесь.
        if: always()
        run: npx tsx scripts/build-announcements.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # Без него notifyRunSummary()/notifyNewExactDates() в build-announcements.ts
          # молча ничего не шлют (гейт "нет секрета - не шлём") - забыли прокинуть
          # при создании этого workflow, в отличие от announcements-hourly.yml.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 6. Коммит данных
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Finish-pending: реакторы/данжи по .локал'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          file_pattern: >-
            src/data/simulators/reactor/gacha.json
            src/data/simulators/reactor/gacha-name-ru.json
            src/data/simulators/reactor/gacha-covers.json
            src/data/simulators/reactor/priority-gachas.json
            src/data/guides/raids.json
            src/data/guides/special-ladders.json
            src/data/mutants/obtain.json
            src/data/announcements.json
            scripts/announced-ids-cache.json
            scripts/pending-screenshots.json
            scripts/resolved-names-cache.json
            scripts/pending-names-cache.json
            public/reactor/**
            public/dungeon-covers/**

      - name: 7. Синхронизация обложек реакторов с Яндекс CDN
        # Тот же приём, что в sync-cron.yml (шаг 7) - заливаем только файлы,
        # реально изменённые в коммите бота, а не всю папку целиком.
        if: always()
        run: |
          pip install awscli

          BASE=$(git rev-parse --verify HEAD~1 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            echo "⚠️  Нет предыдущего коммита для diff — пропуск CDN sync"
            exit 0
          fi

          git diff --name-only --no-renames --diff-filter=ACM "$BASE" HEAD -- 'public/reactor/' 'public/dungeon-covers/' | while read -r f; do
            [ -f "$f" ] || continue
            key="${f#public/}"
            echo "↑ $key"
            aws s3 cp "$f" "s3://archivist-cdn/$key" \
              --endpoint-url https://storage.yandexcloud.net \
              --acl public-read
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1

      - name: 8. Триггер синхронизации preview
        # git-auto-commit-action пушит через дефолтный GITHUB_TOKEN, а такие пуши
        # не каскадируют в другие push-триггеры (анти-рекурсивная защита GitHub) -
        # sync-preview-branch.yml сам не запускался. workflow_dispatch - исключение
        # из этого правила, дёргаем явно. Идемпотентно, лишний вызов не страшен.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-preview-branch.yml --ref main
