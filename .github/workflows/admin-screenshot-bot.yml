name: Admin Screenshot Bot

# Разбирает scripts/pending-screenshots.json (задачи ставит
# build-announcements.ts при каждой новой публикации) и шлёт скриншоты
# новых анонсов в личный админ-чат (TELEGRAM_CHAT_ID). Отдельный workflow
# на 5-минутном cron'е, а не шаг внутри announcements-hourly.yml - задачи
# должны отлежаться минимум 5 минут (Vercel-редеплой после коммита), спать
# внутри одного прогона CI смысла нет, только жжёт минуты впустую. См.
# память auto-announcements-architecture.md ("бот-скриншотер в админ-чат").
#
# 'schedule:' убран 2026-09-15 - GitHub придерживает schedule-триггеры под
# нагрузкой платформы, особенно частые: этот воркфлоу с заявленным '*/5'
# реально стрелял раз в 2-6 часов, из-за чего скрины анонсов не доходили.
# Триггерится теперь внешним cron'ом с VPS-ретранслятора (доступ/детали -
# см. mgg-site-ops вне этого репо) через workflow_dispatch API каждые 5 минут.
on:
  workflow_dispatch:
    inputs:
      test_chat_id:
        description: 'Переопределить чат назначения на этот прогон (для проверки в тестовом чате, вместо реального админ-чата). Пусто = обычный TELEGRAM_CHAT_ID.'
        required: false
        type: string

permissions:
  contents: write

# Общая группа с announcements-hourly.yml/finish-pending.yml - все трое
# пишут в один и тот же scripts/pending-screenshots.json (и announcements.json/
# announced-ids-cache.json), см. комментарий в announcements-hourly.yml про
# non-fast-forward push при параллельной записи.
concurrency:
  group: announcements-writes
  cancel-in-progress: false

jobs:
  screenshot-bot-job:
    runs-on: ubuntu-latest
    # 20 мин: холодный @sparticuz/chromium отвечает до ~90с на вызов, а за
    # один прогон может накопиться несколько задач (в проде редко >2, но
    # запас нужен). Один прогон всё равно ограничен MAX_ATTEMPTS/MIN_AGE_MS
    # в самом скрипте.
    timeout-minutes: 20

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4
        # ref: main ОБЯЗАТЕЛЕН. По умолчанию checkout берёт github.sha - коммит
        # на момент ТРИГГЕРА, а не свежий HEAD. Все воркфлоу этой concurrency-
        # группы пишут в один pending-screenshots.json, и второй в очереди
        # дожидался первого, но выкачивал УСТАРЕВШУЮ очередь и слал скриншоты
        # повторно (найдено 2026-09-16: юзер получил 3 карточки, затем ещё 2
        # дублем, а сам прогон упал на push с non-fast-forward).
        with:
          ref: main

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Установка зависимостей
        run: npm ci

      - name: 3.5 Скриншоты досок бинго для анонсов (рендер один раз -> репо + CDN)
        # Карточка бинго-анонса показывает готовый PNG, а не живой рендер
        # /api/screenshot-bingo на каждого посетителя (тот падал и давал ~1%
        # ошибок на Vercel, 2026-09-21). Скрипт рендерит доску только когда
        # прод уже отдаёт её новую версию, так что шаг здесь, а не в часовом
        # воркфлоу: 5-минутный тик подхватывает новую доску через минуты после
        # деплоя. Сбой рендера не должен блокировать отправку скриншотов в
        # чат - повтор будет в следующий тик.
        continue-on-error: true
        run: npx tsx scripts/render-bingo-screenshots.ts

      - name: 4. Разбор очереди и отправка скриншотов
        run: npx tsx scripts/process-pending-screenshots.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Скрины анонсов -> своя группа (TELEGRAM_ANNOUNCE_CHAT_ID, напр.
          # «MGG Fb | Админка»). test_chat_id перебивает её на разовый прогон.
          # TELEGRAM_CHAT_ID остаётся фолбэком в telegram-admin-bot.ts, если
          # ANNOUNCE-секрет ещё не заведён.
          TELEGRAM_ANNOUNCE_CHAT_ID: ${{ inputs.test_chat_id || secrets.TELEGRAM_ANNOUNCE_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 5. Коммит очереди и скриншотов досок (если что-то изменилось)
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-Sync: очередь скриншотов анонсов'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          # Папкой, не глобом: git add так подхватывает и удаление старой
          # версии скрина доски.
          file_pattern: >-
            scripts/pending-screenshots.json
            src/data/bingo-screenshots.json
            public/bingo-screenshots

      - name: 6. Заливка новых скриншотов досок на Яндекс CDN
        # Тот же приём, что шаг 12 announcements-hourly.yml. Только если шаг 5
        # реально закоммитил, иначе HEAD~1 - чужой старый коммит.
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          pip install awscli
          git diff --name-only --no-renames --diff-filter=ACM HEAD~1 HEAD -- 'public/bingo-screenshots/' | while read -r f; do
            [ -f "$f" ] || continue
            key="${f#public/}"
            echo "↑ $key"
            aws s3 cp "$f" "s3://archivist-cdn/$key" \
              --endpoint-url https://storage.yandexcloud.net \
              --acl public-read
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
