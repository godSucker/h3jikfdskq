name: Auto-Sync Mutants

on:
  schedule:
    # Запуск каждый день в 16:30 МСК (13:30 UTC)
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-cron
  cancel-in-progress: false

jobs:
  sync-job:
    runs-on: ubuntu-latest
    # Раньше было 30 — этого не хватало: npm ci + полный парсер (554 мутанта) +
    # скачивание скинов + pip install + рендер full-текстур + build-skins + commit +
    # CDN sync суммарно легко превышают 30 мин, особенно если Kobojo CDN отвечает
    # медленнее обычного. 60 даёт реальный запас без риска зависнуть навсегда
    # (каждый сетевой шаг ниже и так имеет свои таймауты/инкрементальный режим).
    timeout-minutes: 60

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Установка зависимостей
        run: npm ci

      # Бинго/боксы/обменники/реакторы/данжи переехали в announcements-hourly.yml
      # (2026-08-07) - они пишут реальные данные (не только анонсы), но лёгкие
      # (без рендера текстур), поэтому гоняются раз в час 10-19 МСК, а не раз в
      # сутки здесь. Дублировать оба места незачем. См. память
      # auto-announcements-architecture.

      - name: 4. Запуск Парсера (Режим FULL)
        id: parser
        timeout-minutes: 25
        run: npx tsx scripts/sync-mutants.ts full

      - name: 4.05 Сохранение кэша отсутствующих текстур
        # Парсер пишет scripts/missing-textures-cache.json на диск инкрементально,
        # по мере обнаружения каждой недостающей текстуры (см. saveMissingTextureCache()
        # в sync-mutants.ts) - именно чтобы этот прогресс не терялся при таймауте.
        # Поэтому always(), а не гейт на steps.parser.outcome: если парсер СНОВА
        # упрётся в 25-минутный лимит, кэш всё равно должен закоммититься, иначе
        # следующий прогон опять будет вслепую ждать 15с таймаут на те же самые
        # заведомо отсутствующие текстуры.
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-Sync: кэш отсутствующих текстур'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          file_pattern: 'scripts/missing-textures-cache.json'

      - name: 4.06 Сторож "как получить" (obtain.json)
        # Сверяет свежий mutants.json с obtain.json и флагает мутантов без записи -
        # obtain.json НЕ трогается, это кураторские данные (см. 7 коммитов 2026-07-31
        # с ручной калибровкой наследование vs реальный обтейн и т.п.). Гейт на успех
        # парсера - без свежего mutants.json сверять не с чем.
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/detect-missing-obtain.ts

      - name: 4.07 Синхронизация имён мутантов (names.{lang}.json)
        # Перегенерирует names.{en,es,fr,de,pt,it,tr,nl}.json целиком из свежего
        # mutants.json + официальной localisation_{lang}.txt с CDN Kobojo (без
        # LLM, 100% покрытие ключей). До 2026-08-16 этот шаг не был подключён к
        # cron - новые мутанты от парсера (шаг 4) молча не попадали в имена на
        # 8 языках до следующего РУЧНОГО прогона sync-mutant-names.ts. Идёт
        # сразу после парсера - нужен только mutants.json, без зависимости от
        # скинов/текстур ниже.
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/sync-mutant-names.ts

      - name: 4.1 Установка Python (рендер full-текстур)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/character-textures/requirements.txt

      - name: 4.2 Рендер full-текстур персонажей (инкремент)
        # sync_characters.py чекпоинтит rendered.json каждые 25 рендеров, поэтому
        # даже таймаут здесь не должен терять уже отрендеренное - но чекпоинт
        # бесполезен, если шаги 4.3-5 не запустятся и не закоммитят его. Условие -
        # успех парсера (шаг 4), а НЕ always(): если сам парсер упал/недописал
        # mutants.json, дальше идти нельзя (иначе можем закоммитить частичные данные).
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          pip install -r scripts/character-textures/requirements.txt
          python scripts/character-textures/sync_characters.py

      - name: 4.3 Генерация статов скинов (skins.json)
        # Идёт ПОСЛЕ рендера full-текстур: скин существует тогда и только тогда,
        # когда есть его FULL_*.png. Статы считаются из свежего mutants.json + gacha.xml.
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/build-skins.ts

      - name: 4.4 Скачивание head-текстур скинов
        # Идёт ПОСЛЕ build-skins (4.3): download-skins.ts строит имя файла из id+skin
        # напрямую, так что порядок ему больше не важен для запуска - но повторный
        # build-skins (4.5) ниже должен видеть уже скачанные head-файлы, чтобы
        # прописать их в skins.json (image[1]) в тот же прогон, без задержки на день.
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/download-skins.ts

      - name: 4.5 Перегенерация skins.json (подхват новых head-текстур)
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/build-skins.ts

      - name: 4.55 Синхронизация имён скинов (skins-i18n.json)
        # Тот же приём, что 4.07 выше, но для названий скинов - идёт ПОСЛЕ
        # финальной перегенерации skins.json (4.5), иначе новый скин от
        # сегодняшнего прогона не попадёт в словарь. Не все слаги резолвятся
        # (нет официального ключа даже на RU) - это ожидаемо, скрипт печатает
        # отчёт и оставляет такие на голом slug (см. комментарий в скрипте).
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/sync-skin-names.ts

      - name: 4.56 Синхронизация переводов материалов (materials-i18n.json)
        # material.json/charms.json/orbs.json/buildings.json НЕ зависят от
        # парсера мутантов (статичные, курируются вручную) - без гейта на
        # steps.parser.outcome. Merge с уже лежащим файлом (не перезапись!) -
        # сохраняет 67 кураторских LLM-описаний material.json и
        # Building_Mystery (нет официального ключа), которые скрипт не умеет
        # генерировать сам. См. комментарий в build-materials-i18n.ts.
        if: ${{ !cancelled() }}
        run: npx tsx scripts/build-materials-i18n.ts

      - name: 4.57 Сохранение переводов материалов
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-Sync: переводы материалов'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          file_pattern: 'src/data/materials/materials-i18n.json'

      - name: 4.6 Пересборка топ-листов (toplists.json)
        # Рейтинги /top-mutants и бейджи рангов в MutantModal должны быть в ногу
        # с любым изменением статов/абилок - пересчитываем при каждом успешном
        # прогоне парсера, а не только когда сам rebalance-history.json меняется.
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/build-toplists.ts

      - name: 4.7 Авто-подтяжка иконок скинов (модалка мутанта)
        # Идёт ПОСЛЕ build-skins (4.3/4.5) - источник правды, какие skin id вообще
        # существуют, это src/data/mutants/skins.json. Additive-only: докачивает
        # icon_<skinId>.png с Kobojo CDN только для новых id, не трогает уже
        # известные записи skin-icons.json. См. scripts/sync-skin-icons.ts.
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/sync-skin-icons.ts

      - name: 4.8 Сохранение изменений иконок скинов
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-Sync: иконки скинов'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          file_pattern: 'src/data/mutants/skin-icons.json public/skins/**'

      - name: 4.9 Авто-публикация анонсов (мутанты/скины/бинго/боксы/обменники/ребаланс)
        # Идёт ПОСЛЕДНИМ из data-шагов - нужны самые свежие версии ВСЕХ JSON
        # разом (mutants/skins/bingos/boxes/obtain/rebalance-history). Ledger
        # (scripts/announced-ids-cache.json, НЕ scripts/.cache/ - та папка в
        # .gitignore и не переживает между прогонами CI) хранит уже
        # опубликованные id, так что повторный прогон не задублирует пост,
        # даже если этот шаг упадёт и перезапустится завтра. См. память
        # auto-announcements-architecture - это Фаза 1 (без LLM, без .локал -
        # только типы, где RU-имя уже есть в самих данных).
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: npx tsx scripts/build-announcements.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # TELEGRAM_CHAT_ID (личный чат, не канал) нужен notifyDetectorFailure()
          # и notifyRunSummary() внутри build-announcements.ts - без него оба
          # молча ничего не отправляют (тихий best-effort гейт на оба секрета).
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 4.10 Сохранение анонсов
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-Sync: анонсы'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          file_pattern: 'src/data/announcements.json scripts/announced-ids-cache.json'

      - name: 5. Проверка изменений
        id: check-changes
        if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
        run: |
          if git diff --quiet src/data/mutants/*.json public/textures_by_mutant/ public/textures_by_skins/ scripts/character-textures/rendered.json scripts/missing-skin-textures-cache.json 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Изменений не обнаружено"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Обнаружены изменения в данных"
          fi

      - name: 6. Сохранение изменений (Commit & Push)
        # Гейт на успех парсера, а не на общий success() джобы - иначе таймаут
        # 4.2 (после которого 4.3-5 всё равно отрабатывают по outcome == 'success'
        # парсера) съедал бы этот шаг из-за неявного success() в implicit if.
        if: ${{ !cancelled() && steps.parser.outcome == 'success' && steps.check-changes.outputs.has_changes == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-Sync: Обновление данных мутантов'
          commit_user_name: 'MGG Parser Bot'
          commit_user_email: 'bot@archivist-library.com'
          commit_author: 'MGG Parser Bot <bot@archivist-library.com>'
          branch: main
          file_pattern: 'src/data/mutants/*.json public/textures_by_mutant/** public/textures_by_skins/** scripts/character-textures/rendered.json scripts/missing-skin-textures-cache.json'

      - name: 7. Синхронизация ассетов с Яндекс CDN (инкремент по git diff)
        # Раньше здесь был `aws s3 sync` по 20 папкам. На свежем раннере git checkout
        # ставит всем файлам новый mtime, из-за чего sync считал их изменёнными и
        # перезаливал ВСЕ ~8400 текстур каждый прогон (~6.5 мин). Теперь заливаем
        # только файлы, реально изменённые в коммите бота (HEAD~1..HEAD).
        if: ${{ !cancelled() && steps.parser.outcome == 'success' && steps.check-changes.outputs.has_changes == 'true' }}
        run: |
          pip install awscli

          BASE=$(git rev-parse --verify HEAD~1 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            echo "⚠️  Нет предыдущего коммита для diff — пропуск CDN sync"
            exit 0
          fi

          S3="s3://archivist-cdn"
          ENDPOINT="https://storage.yandexcloud.net"

          # Добавленные/изменённые файлы под public/ -> заливаем
          git diff --name-only --no-renames --diff-filter=ACM "$BASE" HEAD -- 'public/' | while read -r f; do
            [ -f "$f" ] || continue
            key="${f#public/}"
            echo "↑ $key"
            aws s3 cp "$f" "$S3/$key" \
              --endpoint-url "$ENDPOINT" \
              --acl public-read
          done

          # Удалённые файлы под public/ -> удаляем с CDN
          git diff --name-only --no-renames --diff-filter=D "$BASE" HEAD -- 'public/' | while read -r f; do
            key="${f#public/}"
            echo "✗ $key"
            aws s3 rm "$S3/$key" \
              --endpoint-url "$ENDPOINT"
          done

          echo "✅ CDN обновлён (только изменённые файлы)"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1

      - name: 7.1 Синхронизация статики с Яндекс CDN
        # Статические папки (иконки, орбы, материалы и т.п.) меняются обычными
        # коммитами разработчиков, а не ботом — поэтому шаг НЕ завязан на has_changes.
        # --size-only: игнорируем mtime (после git checkout он всегда свежий),
        # сравниваем только размер, чтобы не перезаливать неизменённое. Папки мелкие
        # (~48с на все вместе). textures_by_mutant/textures_by_skins тут НЕ трогаем —
        # их инкрементально синкает шаг 7.
        if: always()
        run: |
          pip install awscli
          for dir in skins etc genes cash tokens orbs bingo boxes orbing materials stars zones ability avatars boosters buildings med mut_icons sims; do
            if [ -d "public/$dir" ]; then
              echo "Syncing $dir..."
              aws s3 sync "public/$dir/" "s3://archivist-cdn/$dir/" \
                --endpoint-url https://storage.yandexcloud.net \
                --acl public-read \
                --size-only \
                --delete
            fi
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1

      - name: 8. Итоги работы
        if: always()
        run: |
          echo "## 📊 Итоги синхронизации" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **Статус:** Обнаружены изменения, данные обновлены" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Статус:** Изменений не обнаружено" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f scripts/.cache/bingo-summary.md ]; then
            cat scripts/.cache/bingo-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f scripts/.cache/obtain-summary.md ]; then
            cat scripts/.cache/obtain-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f scripts/.cache/exchange-summary.md ]; then
            cat scripts/.cache/exchange-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f scripts/.cache/skin-icons-summary.md ]; then
            cat scripts/.cache/skin-icons-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f scripts/.cache/announcements-summary.md ]; then
            cat scripts/.cache/announcements-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f scripts/.cache/parser-summary.md ]; then
            cat scripts/.cache/parser-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f scripts/character-textures/.cache/summary.md ]; then
            cat scripts/character-textures/.cache/summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "🕐 **Время запуска:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ **Режим:** FULL (данные) + character-textures (инкремент)" >> $GITHUB_STEP_SUMMARY

      - name: 9. Триггер синхронизации preview
        # git-auto-commit-action пушит через дефолтный GITHUB_TOKEN, а пуши от
        # GITHUB_TOKEN не каскадируют в другие push-триггеры (анти-рекурсивная
        # защита GitHub) - sync-preview-branch.yml (on: push: [main]) от таких
        # коммитов сам не запускался. workflow_dispatch - исключение из этого
        # правила, поэтому дёргаем его явно. Идемпотентно (up_to_date, если
        # сливать нечего), лишний вызов ничего не ломает.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-preview-branch.yml --ref main
